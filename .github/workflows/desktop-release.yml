name: Desktop release

# Builds the desktop app from a commit of `desktop`, tests the installers on
# fresh machines, and only then publishes them as a GitHub Release. Started
# by hand; the operating manual is docs/MAINTAINING.md, "Cutting a release".
#
# The release is what installed apps update from: they read latest*.yml from
# the release GitHub marks as the latest. So nothing is published until every
# file is there and matches its checksum, and a release is never changed
# afterwards.
#
#   plan     is the request sound? which commit?            read-only
#   build    desktop-build.yml: build, sign, test            its gate and sign jobs use the environment `desktop-release`
#   release  checksums, provenance, draft, upload, publish   contents: write, runs no build code
#
# The tag is `desktop-v<version>` and is put on this branch (`main`), not on
# `desktop`: a tag on `desktop` carries upstream's `on: release` workflows.
# The notes record the `desktop` commit the installers were built from.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.2.3 (1.3.0-rc.1 for a pre-release)
        type: string
        required: true
      ref:
        description: What to build - the desktop branch, or one of its commits
        type: string
        default: desktop
      prerelease:
        description: Pre-release - installed apps are not offered it
        type: boolean
        default: false

permissions: {}

# One release at a time, and never cancelled half way through publishing.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  plan:
    name: Check the request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read the environment's branch policy
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      # The release's tag goes on the commit this run started from, and the
      # signing environment admits no other branch.
      - name: Refuse to run from anything but main
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error title=Release refused::Start this workflow from the main branch, not ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Check out the automation (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Check the version, the commit and the signing environment
        id: plan
        shell: bash
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          # shellcheck disable=SC2086  # PRERELEASE is one flag or nothing
          python3 scripts/release_plan.py --repo "${GITHUB_REPOSITORY}" \
            --version "${VERSION}" --ref "${REF}" ${PRERELEASE}

  build:
    name: Build
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      e2e: true
      version: ${{ inputs.version }}
      sign: true
      release_files: true
    # The signing secrets are environment secrets; the gate and sign jobs
    # of that workflow name the environment and read them by name. There is
    # no repository secret.
    secrets: inherit

  release:
    name: Publish
    # Every build leg and every installed-app test passed.
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # the release and its tag
      id-token: write # sign the provenance attestation
      attestations: write # store it
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      DESKTOP_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - name: Download the Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 15
        with:
          name: installers-windows-x64
          path: out

      - name: Download the macOS disk image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 15
        with:
          name: installers-macos-arm64
          path: out

      - name: Download the Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 15
        with:
          name: installers-linux-x64
          path: out

      - name: Download the update metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 15
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      # An installed app trusts latest*.yml: the version it names is offered,
      # and the file it names is accepted if its SHA-512 is the one given.
      - name: Check that the release is complete and consistent
        shell: bash
        run: |
          cd out
          ls -l
          fail() { echo "::error title=Incomplete release::$1"; exit 1; }
          if [ -n "$(find . -mindepth 1 -type d)" ]; then fail "Unexpected directories among the release files."; fi
          for file in \
            "AutoGPT-Setup-${VERSION}-x64.exe" latest.yml \
            "AutoGPT-${VERSION}-arm64.dmg" latest-mac.yml \
            AutoGPT-x86_64.AppImage "AutoGPT-${VERSION}-amd64.deb" latest-linux.yml \
            signing-windows-x64.txt signing-macos-arm64.txt signing-linux-x64.txt; do
            [ -s "${file}" ] || fail "${file} is missing."
          done
          for metadata in latest*.yml; do
            grep -qx "version: ${VERSION}" "${metadata}" || fail "${metadata} is not for version ${VERSION}."
            count=0
            while read -r name expected; do
              [ -f "${name}" ] || fail "${metadata} names ${name}, which is not in the release."
              actual="$(openssl dgst -sha512 -binary "${name}" | base64 -w 0)"
              [ "${actual}" = "${expected}" ] || fail "${name} does not have the SHA-512 that ${metadata} gives."
              count=$((count + 1))
            done < <(awk '$1 == "-" && $2 == "url:" { name = $3 } $1 == "sha512:" && name != "" { print name, $2; name = "" }' "${metadata}")
            [ "${count}" -gt 0 ] || fail "${metadata} names no file."
            echo "${metadata}: ${count} file(s) match"
          done
          # macOS updates itself only when signed, and then from the zip.
          if grep -q "Developer ID" signing-macos-arm64.txt; then
            grep -q "AutoGPT-${VERSION}-arm64.zip" latest-mac.yml || fail "latest-mac.yml does not name the zip a signed macOS app updates from."
          fi

      - name: Write the release notes and SHA256SUMS
        shell: bash
        run: |
          {
            echo "AutoGPT Desktop ${VERSION}, built from \`desktop\` commit [\`${DESKTOP_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${DESKTOP_SHA}) by [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "| System | Download | How it is signed |"
            echo "| --- | --- | --- |"
            echo "| Windows x64 | \`AutoGPT-Setup-${VERSION}-x64.exe\` | $(cut -d: -f2- out/signing-windows-x64.txt | sed 's/^ //') |"
            echo "| macOS, Apple silicon | \`AutoGPT-${VERSION}-arm64.dmg\` | $(cut -d: -f2- out/signing-macos-arm64.txt | sed 's/^ //') |"
            echo "| Linux x64 | \`AutoGPT-x86_64.AppImage\`, \`AutoGPT-${VERSION}-amd64.deb\` | $(cut -d: -f2- out/signing-linux-x64.txt | sed 's/^ //') |"
            echo
            echo "The other files are what an installed app updates itself from."
            echo
            echo "To check a download:"
            echo
            echo '```'
            echo "sha256sum --check --ignore-missing SHA256SUMS"
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } > notes.md
          rm out/signing-*.txt
          (cd out && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS out/SHA256SUMS
          cat notes.md out/SHA256SUMS

      - name: Attest where the files were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        timeout-minutes: 10
        with:
          subject-checksums: out/SHA256SUMS

      # A draft is invisible to installed apps and has no tag yet, so it is
      # found in the list of releases and not by its tag; GitHub allows
      # several drafts with one tag name. Every draft an earlier attempt left
      # behind is removed; a published release is never touched. A listing
      # that fails stops the step: "could not look" is not "there is none".
      - name: Create the draft
        shell: bash
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.prerelease && '--prerelease' || '--latest=false' }}
        run: |
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\") | \"\(.id) \(.draft)\"")"
          if grep -q ' false$' <<< "${existing}"; then
            echo "::error title=Already released::${TAG} is published. A release is never replaced; use the next version."
            exit 1
          fi
          while read -r id draft; do
            [ "${draft}" = "true" ] || continue
            echo "Removing the draft ${id} that an earlier attempt left behind"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done <<< "${existing}"
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft "${KIND}" \
            --target "${GITHUB_SHA}" --title "AutoGPT Desktop ${VERSION}" --notes-file notes.md

      - name: Upload the files
        shell: bash
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" out/* --repo "${GITHUB_REPOSITORY}"

      # What GitHub stored is compared with what was built before anyone can
      # download it.
      - name: Check the uploaded files
        shell: bash
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft has no tag, so it is found in the list and not by its tag.
          drafts="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"${TAG}\") | .id")"
          if [ "$(grep -c . <<< "${drafts}")" != "1" ]; then
            echo "::error title=Not one draft::Expected exactly one draft named ${TAG}, found: ${drafts:-none}. Nothing was published."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${drafts}" \
            --jq ".assets[] | select(.name != \"SHA256SUMS\") | (.digest | sub(\"^sha256:\"; \"\")) + \"  \" + .name" \
            | sort -k 2 > uploaded
          grep -v '  SHA256SUMS$' out/SHA256SUMS | sort -k 2 > built
          if ! diff built uploaded; then
            echo "::error title=Upload differs::The files in the draft are not the files that were built. The draft was not published."
            exit 1
          fi

      # Only now does the release exist for installed apps: GitHub creates
      # the tag, and a full release becomes the latest one.
      - name: Publish
        shell: bash
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.prerelease && '--prerelease' || '--latest' }}
        run: |
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false "${KIND}"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "Published ${url}" | tee -a "${GITHUB_STEP_SUMMARY}"
