name: Desktop build

# Builds and tests the desktop app (autogpt_platform/desktop on the `desktop`
# branch) on clean GitHub-hosted machines. This is the only place that knows
# how: the `desktop` branch calls it for pull requests and pushes,
# desktop-nightly.yml calls it with the installed-app tests switched on, and
# desktop-release.yml calls it to build what it publishes.
#
# The workflow lives on `main` and the code on `desktop`, so every checkout
# names the ref it is given. Nothing is published here.
#
# Variants. An experiment branch `variant/<slug>` is built by this same
# workflow into an app that installs next to the normal one and shares
# nothing with it (docs/MAINTAINING.md, "Variants"). The `identity` job
# decides which app a run builds and asks the code being built for that
# app's names (autogpt_platform/desktop/src/identity.js): nothing here spells
# out how a variant is named, and no variant is listed anywhere.
#
# Signing. Only desktop-release.yml asks for it (`sign`). The certificates
# are in the `desktop-release` environment, which admits the branch `main`
# only: a call from `desktop` that set `sign` would be refused by the
# environment before a job that names it starts. What is signed depends only
# on which secrets exist there (docs/MAINTAINING.md, "Cutting a release");
# with none, the build is the same ad-hoc/unsigned one as for a pull request.
#
# Steps of one job share a machine, a user, $GITHUB_ENV and $GITHUB_PATH, so
# giving a secret to "only the packaging step" keeps it from nothing that ran
# earlier in that job. The build runs a great deal of other people's code
# (the frontend's and the backend's dependencies with their install scripts,
# compilers, the stack itself in the smoke test). So the secrets are kept in
# other jobs, on other machines:
#
#   gate   in the environment; asks which secrets exist and runs nothing else
#   build  no environment, no secret; assembles, tests, and packages every
#          leg that nobody signs
#   sign   in the environment; for a leg with a certificate, takes the
#          assembled runtime as an archive and only packages and signs it

# What the build-report workflow tells a variant's build from a build of
# `desktop` by: it only sees this title.
run-name: >-
  Desktop build of ${{ inputs.ref }}${{ inputs.variant && format(' as variant {0}', inputs.variant) || '' }}

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit of this repository to build
        type: string
        default: desktop
      variant:
        description: Slug of the variant to build. Empty for the normal app, or to take it from a branch named variant/<slug>.
        type: string
        default: ""
      branch:
        description: The branch `ref` belongs to, when `ref` is a commit. `variant/<slug>` makes it that variant's build.
        type: string
        default: ""
      e2e:
        description: Install the built app on fresh machines and test it
        type: boolean
        default: false
      version:
        description: The app's version. Empty for a development build, 0.0.0-dev.<run number>.
        type: string
        default: ""
      sign:
        description: Sign with whatever certificates the desktop-release environment holds
        type: boolean
        default: false
      release_files:
        description: Also upload what a release needs besides the installers (update metadata, the macOS zip)
        type: boolean
        default: false
    outputs:
      variant:
        description: The slug of the variant that was built; empty for the normal app
        value: ${{ jobs.identity.outputs.variant }}
      suffix:
        description: What follows the name of every artifact of this build; empty for the normal app
        value: ${{ jobs.identity.outputs.suffix }}
      artifact_base:
        description: What the installers' file names start with
        value: ${{ jobs.identity.outputs.artifact_base }}
      tag_prefix:
        description: What a release tag of this app is, before the version
        value: ${{ jobs.identity.outputs.tag_prefix }}
      product_name:
        description: The app's name as people see it
        value: ${{ jobs.identity.outputs.product_name }}
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of this repository to build
        type: string
        default: desktop
      variant:
        description: Slug of the variant to build. Empty for the normal app, or to take it from a branch named variant/<slug>.
        type: string
        default: ""
      e2e:
        description: Install the built app on fresh machines and test it
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The runner is thrown away; a uv cache would only take disk the build needs.
  UV_NO_CACHE: "1"

jobs:
  # Which app this run builds. A branch named variant/<slug> is that variant
  # and nothing else: built as the normal app, an experiment's code would
  # open the normal app's data. A commit can be named in other ways than by
  # its branch (a SHA, a tag), so a build that names no variant is refused
  # unless its commit is on `desktop`, or a caller says which branch it is
  # for: the caller workflow does for pull requests, whose commits are on no
  # branch yet. The names come from the commit being built, which is the
  # only definition of them; a commit from before there were variants has no
  # such file and is the normal app.
  identity:
    name: Which app
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      variant: ${{ steps.names.outputs.variant }}
      suffix: ${{ steps.names.outputs.suffix }}
      product_name: ${{ steps.names.outputs.product_name }}
      product_filename: ${{ steps.names.outputs.product_filename }}
      package_name: ${{ steps.names.outputs.package_name }}
      dir_name: ${{ steps.names.outputs.dir_name }}
      artifact_base: ${{ steps.names.outputs.artifact_base }}
      tag_prefix: ${{ steps.names.outputs.tag_prefix }}
    steps:
      - name: Check out the names from ${{ inputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
          sparse-checkout: autogpt_platform/desktop/src

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      # The normal app is built from `desktop` and from nothing else. A
      # commit of a variant branch named by its SHA, or by a tag, would
      # otherwise come out as the normal app with the experiment in it. This
      # is the one step of the job with a token, and it comes before the
      # step that runs the commit's own code.
      - name: Check that the normal app is built from desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.variant }}
          BRANCH: ${{ inputs.branch || inputs.ref }}
          # Empty unless a calling workflow named the branch the build is for.
          NAMED_BRANCH: ${{ inputs.branch }}
        run: |
          refuse() {
            echo "::error title=Variant refused::$1 See docs/MAINTAINING.md, 'Variants'."
            exit 1
          }
          BRANCH="${BRANCH#refs/heads/}"
          if [ -n "${VARIANT}" ] || [ -n "${NAMED_BRANCH}" ] || [[ "${BRANCH}" == variant/* ]]; then
            exit 0
          fi
          sha="$(git rev-parse HEAD)"
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${sha}...desktop" --jq .status)" ||
            refuse "Could not find out whether ${sha} is a commit of desktop, so it is not built as the normal app."
          case "${status}" in
            ahead | identical) ;;
            *) refuse "${sha} is not on the desktop branch, and only desktop is built as the normal app. To build an experiment, name it: -f variant=<slug>. To try a change to the normal app, open a pull request into desktop." ;;
          esac

      - name: Name the app
        id: names
        shell: bash
        env:
          VARIANT: ${{ inputs.variant }}
          BRANCH: ${{ inputs.branch || inputs.ref }}
        run: |
          refuse() {
            echo "::error title=Variant refused::$1 See docs/MAINTAINING.md, 'Variants'."
            exit 1
          }
          BRANCH="${BRANCH#refs/heads/}"
          from_branch=""
          case "${BRANCH}" in
            variant/*) from_branch="${BRANCH#variant/}" ;;
          esac
          if [ -n "${from_branch}" ] && [ -n "${VARIANT}" ] && [ "${VARIANT}" != "${from_branch}" ]; then
            refuse "The branch ${BRANCH} is the variant '${from_branch}' and cannot be built as '${VARIANT}'."
          fi
          variant="${VARIANT:-${from_branch}}"
          if [ -n "${variant}" ] && ! [[ "${variant}" =~ ^[a-z0-9]([a-z0-9-]{0,22}[a-z0-9])?$ ]]; then
            refuse "'${variant}' cannot name a variant: use 1 to 24 lower-case letters, digits or hyphens, not starting or ending with a hyphen."
          fi
          if [[ "${variant}" =~ (^|-)updater$ ]]; then
            refuse "'${variant}' cannot name a variant: 'updater' and names ending in '-updater' are the folders of other installs' update downloads."
          fi

          names=autogpt_platform/desktop/src/identity.js
          if [ -f "${names}" ]; then
            AUTOGPT_DESKTOP_VARIANT="${variant}" node "${names}" > names.txt
          elif [ -z "${variant}" ]; then
            # A commit from before there were variants: the normal app, as it
            # was then.
            printf '%s\n' variant= product_name=AutoGPT product_filename=AutoGPT \
              package_name=autogpt dir_name=AutoGPT artifact_base=AutoGPT \
              tag_prefix=desktop-v branch=desktop > names.txt
          else
            refuse "This commit has no ${names}: it is older than variants and can only be built as the normal app."
          fi
          cat names.txt
          # The file comes from the commit being built, and its lines end up
          # in file names and in a release's tag.
          if grep -qvE '^[a-z_]+=[A-Za-z0-9 ()./_-]*$' names.txt; then
            refuse "${names} printed something that is not a name."
          fi
          for name in variant product_name product_filename package_name dir_name artifact_base tag_prefix; do
            [ "$(grep -c "^${name}=" names.txt)" = "1" ] || refuse "${names} did not print ${name} exactly once."
          done
          grep -qx "variant=${variant}" names.txt || refuse "${names} did not name the variant '${variant}'."
          {
            cat names.txt
            echo "suffix=${variant:+-${variant}}"
          } >> "${GITHUB_OUTPUT}"
          if [ -n "${variant}" ]; then
            echo "Building the variant \`${variant}\`: $(sed -n 's/^product_name=//p' names.txt)" >> "${GITHUB_STEP_SUMMARY}"
          fi

  unit:
    name: Unit tests (${{ matrix.os }})
    needs: identity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-22.04]
    defaults:
      run:
        shell: bash
    steps:
      # One system gets the whole history, for the test below that needs it.
      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ matrix.os == 'ubuntu-22.04' && '0' || '1' }}
          persist-credentials: false

      # runtime/tests/test_fork_surface.py holds `desktop` to differing from
      # upstream only inside autogpt_platform/desktop. It finds upstream by
      # this URL and skips, saying so, where it has no upstream to compare
      # with: the other two systems.
      - name: Fetch upstream to compare with
        if: matrix.os == 'ubuntu-22.04'
        run: |
          git remote add upstream https://github.com/Significant-Gravitas/AutoGPT.git
          git fetch --no-tags upstream +refs/heads/dev:refs/remotes/upstream/dev

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Shell tests
        working-directory: autogpt_platform/desktop
        run: node --test "test/*.test.js"

      # Told which variant this is, for the one test that has to know: a
      # variant differs from upstream outside the desktop directory, which
      # `desktop` itself must never do.
      - name: Runtime tests
        working-directory: autogpt_platform/desktop/runtime
        env:
          AUTOGPT_DESKTOP_VARIANT: ${{ needs.identity.outputs.variant }}
        run: >-
          uv run --python 3.13 --no-project
          --with pytest --with pytest-asyncio --with aiohttp --with redis
          --with psycopg2-binary --with pika --with psutil --with cryptography
          python -m pytest -q

  # Which certificates exist. The only thing this job does with the
  # environment's secrets is ask whether each is there; it checks nothing
  # out and runs nothing but the lines below. A set that is only partly
  # there fails the run here, before anything is built: a release must not
  # come out half signed, or unsigned because of a typing mistake.
  gate:
    name: Signing gate
    if: inputs.sign
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: desktop-release
    outputs:
      # How the `sign` job signs each system, or empty: nobody signs it.
      mac: ${{ steps.gate.outputs.mac }}
      win: ${{ steps.gate.outputs.win }}
      mac_description: ${{ steps.gate.outputs.mac_description }}
      win_description: ${{ steps.gate.outputs.win_description }}
      # The matrix of the `sign` job, as JSON.
      legs: ${{ steps.gate.outputs.legs }}
    steps:
      - name: Signing gate
        id: gate
        shell: bash
        env:
          HAS_MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK != '' }}
          HAS_MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD != '' }}
          HAS_APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          HAS_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT != '' }}
          HAS_AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT != '' }}
          HAS_AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE != '' }}
          HAS_AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER != '' }}
          HAS_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK != '' }}
          HAS_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD != '' }}
          # electron-builder's own names. Nothing here reads them, so a
          # certificate stored under one of them would be silently unused.
          HAS_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
          HAS_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
        run: |
          refuse() {
            echo "::error title=Signing is half configured::$1 See docs/MAINTAINING.md, 'Cutting a release'."
            exit 1
          }
          # "all", "none", or the names that are missing from a set that is
          # partly there.
          state() {
            local missing="" present=0 name flag
            for name in "$@"; do
              flag="HAS_${name}"
              if [ "${!flag}" = "true" ]; then
                present=$((present + 1))
              else
                missing="${missing:+${missing}, }${name}"
              fi
            done
            if [ -z "${missing}" ]; then echo all; elif [ "${present}" -eq 0 ]; then echo none; else echo "${missing}"; fi
          }
          complete() {
            local label="$1" found
            shift
            found="$(state "$@")"
            case "${found}" in
              all) return 0 ;;
              none) return 1 ;;
              *) refuse "${label} is only partly configured in the desktop-release environment. Missing: ${found}." ;;
            esac
          }

          misnamed="$(state CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY)"
          if [ "${misnamed}" != "none" ]; then
            refuse "The environment has a secret named CSC_LINK, CSC_KEY_PASSWORD or APPLE_API_KEY, which nothing reads. The names are MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD and APPLE_API_KEY_P8 (WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD for Windows)."
          fi

          mac=""
          mac_description="ad-hoc signed, not notarized: no certificate is configured"
          win=""
          win_description="not signed: no certificate is configured"
          legs=""
          if complete "Apple signing" MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; then
            mac=developer-id
            mac_description="signed with a Developer ID and notarized by Apple"
            legs='{"name":"macOS arm64","key":"macos-arm64","os":"macos-15","mode":"developer-id","timeout":240,"description":"'"${mac_description}"'"}'
          fi
          # Both are looked at, so that a half-set one is refused even when
          # the other is complete. Azure wins when both are.
          azure=false
          pfx=false
          if complete "Azure Trusted Signing" AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGN_ENDPOINT AZURE_SIGN_ACCOUNT AZURE_SIGN_PROFILE AZURE_SIGN_PUBLISHER; then azure=true; fi
          if complete "The Windows certificate" WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; then pfx=true; fi
          if [ "${azure}" = "true" ]; then
            win=azure
            win_description="signed with Azure Trusted Signing"
          elif [ "${pfx}" = "true" ]; then
            win=pfx
            win_description="signed with the publisher's certificate"
          fi
          if [ -n "${win}" ]; then
            legs="${legs:+${legs},}"'{"name":"Windows x64","key":"windows-x64","os":"windows-2022","mode":"'"${win}"'","timeout":120,"description":"'"${win_description}"'"}'
          fi
          {
            echo "mac=${mac}"
            echo "win=${win}"
            echo "mac_description=${mac_description}"
            echo "win_description=${win_description}"
            echo "legs=[${legs}]"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "macOS: ${mac_description}"
            echo "Windows: ${win_description}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build (${{ matrix.name }})
    # The gate is skipped for every build but a release.
    needs: [identity, unit, gate]
    if: ${{ !cancelled() && needs.identity.result == 'success' && needs.unit.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      # How the `sign` job will sign this leg. Empty: nobody signs it, and
      # it is packaged here.
      SIGNED_LATER: ${{ needs.gate.outputs[matrix.signer] }}
      # The executable's name, and the macOS bundle's.
      APP_FILE: ${{ needs.identity.outputs.product_filename }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported image of each OS: what is built here runs on
        # that system and everything newer. The e2e job tests the newer ones.
        include:
          - name: Windows x64
            key: windows-x64
            os: windows-2022
            python: python/python.exe
            signer: win
            timeout: 120
            smoke_timeout: 600
          - name: macOS arm64
            key: macos-arm64
            os: macos-15
            python: python/bin/python3
            signer: mac
            # 3 cores and 7 GB: the frontend build and a 6 GB stack both swap.
            timeout: 180
            smoke_timeout: 900
          - name: Linux x64
            key: linux-x64
            os: ubuntu-22.04
            python: python/bin/python3
            signer: none
            timeout: 120
            smoke_timeout: 600
    defaults:
      run:
        shell: bash
        working-directory: autogpt_platform/desktop
    steps:
      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: autogpt_platform/frontend/package.json

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Target macOS 12 and newer
        if: runner.os == 'macOS'
        # Valkey is compiled here; without this it only loads on this image's
        # own macOS version or newer.
        run: echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"

      # --- caches: inputs only, never the 2 GB runtime or uv's wheels -------

      - name: Cache pinned downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            autogpt_platform/desktop/build/.cache/*.tar.gz
            autogpt_platform/desktop/build/.cache/*.tar.bz2
            autogpt_platform/desktop/build/.cache/*.tar.xz
            autogpt_platform/desktop/build/.cache/*.zip
            autogpt_platform/desktop/build/.cache/*.exe
            autogpt_platform/desktop/build/.cache/otp-*-src
          key: desktop-downloads-${{ matrix.key }}-${{ hashFiles('autogpt_platform/desktop/build/artifacts.py', 'autogpt_platform/desktop/build/erlang_patches.py') }}

      - name: Locate the pnpm store
        id: pnpm
        working-directory: autogpt_platform/frontend
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: desktop-pnpm-${{ matrix.key }}-${{ hashFiles('autogpt_platform/frontend/pnpm-lock.yaml') }}

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: desktop-electron-${{ matrix.key }}-${{ hashFiles('autogpt_platform/desktop/package-lock.json') }}

      # Not effective yet: build_runtime.py rebuilds PostgreSQL every time.
      # It starts saving minutes once step_postgres keeps its result in
      # build/.cache/postgres-built and skips the compile when that is current.
      - name: Cache the PostgreSQL build
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: autogpt_platform/desktop/build/.cache/postgres-built
          key: desktop-postgres-${{ matrix.os }}-${{ hashFiles('autogpt_platform/desktop/build/artifacts.py', 'autogpt_platform/desktop/build/build_runtime.py') }}

      # Not effective yet, for the same reason: step_valkey has to keep its
      # result in build/.cache/valkey-built.
      - name: Cache the Valkey build
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: autogpt_platform/desktop/build/.cache/valkey-built
          key: desktop-valkey-${{ matrix.os }}-target12.0-${{ hashFiles('autogpt_platform/desktop/build/artifacts.py', 'autogpt_platform/desktop/build/build_runtime.py') }}

      # --- Valkey for Windows: built under MSYS2, only when the pin moved ---

      - name: Cache Valkey for Windows
        if: runner.os == 'Windows'
        id: valkey
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: autogpt_platform/desktop/build/.cache/valkey-windows
          key: desktop-valkey-windows-${{ hashFiles('autogpt_platform/desktop/build/valkey-windows.sh', 'autogpt_platform/desktop/build/artifacts.py') }}

      - name: Read the Valkey pin
        if: runner.os == 'Windows' && steps.valkey.outputs.cache-hit != 'true'
        id: valkey-pin
        working-directory: autogpt_platform/desktop/build
        run: |
          uv run --python 3.13 --no-project python -c "
          import artifacts
          print('version=' + artifacts.VALKEY_VERSION)
          print('sha256=' + artifacts.ARTIFACTS['darwin-arm64']['valkey'].sha256)
          " | tr -d '\r' >> "$GITHUB_OUTPUT"

      - name: Set up MSYS2
        if: runner.os == 'Windows' && steps.valkey.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MSYS
          # The MSYS2 runtime DLL ships inside the installer: take the one
          # this action version installs, not whatever is newest today.
          # The package list is therefore as old as this action version, and
          # mirrors drop superseded packages. A 404 from pacman in this step
          # means the list has gone stale: move the SHA above to a newer
          # setup-msys2 release (Valkey is then rebuilt against its DLL).
          update: false
          install: gcc make pkgconf tar

      - name: Build Valkey for Windows
        if: runner.os == 'Windows' && steps.valkey.outputs.cache-hit != 'true'
        shell: msys2 {0}
        env:
          VALKEY_VERSION: ${{ steps.valkey-pin.outputs.version }}
          VALKEY_SHA256: ${{ steps.valkey-pin.outputs.sha256 }}
        run: bash build/valkey-windows.sh "${VALKEY_VERSION}" build/.cache/valkey-windows "${VALKEY_SHA256}"

      # --- assemble, smoke test, package -------------------------------------

      - name: Disk and memory before assembling
        run: |
          df -h .
          case "${RUNNER_OS}" in
            Linux) free -m ;;
            macOS) sysctl -n hw.memsize; vm_stat ;;
            Windows) powershell -NoProfile -Command "Get-CimInstance Win32_OperatingSystem | Format-List TotalVisibleMemorySize,FreePhysicalMemory" ;;
          esac

      # The frontend's own build script asks for a 16 GB heap, more than the
      # macOS runner has. That is settled in build_runtime.step_frontend, not
      # here: NODE_OPTIONS set from this file would be overridden by it.
      - name: Assemble the runtime
        run: uv run --python 3.13 --no-project build/build_runtime.py

      - name: Disk and memory after assembling
        run: |
          df -h .
          du -sh build/runtime
          case "${RUNNER_OS}" in
            Linux) free -m ;;
            macOS) vm_stat ;;
            Windows) powershell -NoProfile -Command "Get-CimInstance Win32_OperatingSystem | Format-List TotalVisibleMemorySize,FreePhysicalMemory" ;;
          esac

      # A data directory with a space in its path, as macOS always has.
      # Windows runners are administrators: this passes there only once the
      # runtime starts PostgreSQL through pg_ctl (postgres.py), which drops
      # the administrator token that postgres.exe refuses to run with.
      - name: Smoke-test the runtime
        run: >-
          build/runtime/${{ matrix.python }} -B build/smoke_test.py build/runtime
          --timeout ${{ matrix.smoke_timeout }}
          --data-dir "${RUNNER_TEMP}/autogpt smoke"

      # Once more with every file of the bundle unwritable, which is how a
      # system-wide install on Linux and a signed app on macOS run: a
      # service that writes beside its code fails here, not on a user's
      # machine. One start is enough to see it.
      - name: Smoke-test the runtime, read-only
        if: runner.os != 'Windows'
        run: >-
          build/runtime/${{ matrix.python }} -B build/smoke_test.py build/runtime
          --timeout ${{ matrix.smoke_timeout }} --read-only --quick

      - name: Free disk for packaging
        run: |
          rm -rf ../frontend/node_modules ../frontend/.next
          df -h .

      # --- version: decided before anything is packaged -----------------------

      - name: Version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED:-0.0.0-dev.${GITHUB_RUN_NUMBER}}"
          # Semantic versioning to the letter: 1.2.03 and 1.2.3-rc.01 are not
          # versions, and electron-updater refuses them in an installed app.
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "${version}" =~ ^${number}\.${number}\.${number}(-${identifier}(\.${identifier})*)?$ ]]; then
            echo "::error::'${version}' is not a version such as 1.2.3 or 1.2.3-rc.1."
            exit 1
          fi
          # What the upgrade test installs over this build: the next patch.
          next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))${BASH_REMATCH[4]}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "next=${next}" >> "${GITHUB_OUTPUT}"
          echo "Building ${version} (the upgrade test uses ${next})"

      - name: Install the packaging tools
        run: npm ci --no-audit --no-fund

      # Again, now that the packages are there: some tests read
      # electron-updater and @electron/osx-sign and are skipped without them.
      - name: Shell tests against the installed packages
        run: node --test "test/*.test.js"

      # --- a leg nobody signs is packaged here ---------------------------------

      - name: Package (no certificate)
        if: env.SIGNED_LATER == ''
        env:
          AUTOGPT_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
          AUTOGPT_DESKTOP_VARIANT: ${{ needs.identity.outputs.variant }}
          # Windows is unsigned and macOS is ad-hoc signed
          # (electron-builder.config.js). electron-builder skips every macOS
          # signature, the ad-hoc one too, on pull requests unless told to.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
        run: npx electron-builder --config electron-builder.config.js --publish never

      # The bundle's seal, and the Claude Code CLI byte for byte as it was
      # bundled: it ships as Anthropic built it.
      - name: Verify the ad-hoc macOS signature
        if: env.SIGNED_LATER == '' && runner.os == 'macOS'
        run: |
          app="dist/mac-arm64/${APP_FILE}.app"
          codesign --verify --deep --strict --verbose=2 "${app}"
          cmp build/runtime/site/claude_agent_sdk/_bundled/claude \
            "${app}/Contents/Resources/runtime/site/claude_agent_sdk/_bundled/claude"

      # An installed app refuses an update unless every file its metadata
      # names is that app's own installer by name (src/updater.js). The same
      # code is asked here, so that a build whose files it would refuse
      # fails now and not as a release nobody is ever offered.
      - name: Check that installed apps will take these files as an update
        if: env.SIGNED_LATER == ''
        env:
          AUTOGPT_DESKTOP_VARIANT: ${{ needs.identity.outputs.variant }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          metadata=(dist/latest*.yml)
          if [ "${#metadata[@]}" -eq 0 ] || [ ! -f src/identity.js ]; then
            echo "No update metadata, or a commit from before this check: nothing to ask."
            exit 0
          fi
          awk '$1 == "-" && $2 == "url:" { print $3 } $1 == "path:" { print $2 }' "${metadata[@]}" | tr -d '\r' | sort -u > update-files.txt
          cat update-files.txt
          if [ ! -s update-files.txt ]; then
            echo "::error::The update metadata names no file."
            exit 1
          fi
          xargs node src/identity.js owns "${VERSION}" < update-files.txt
          rm update-files.txt

      # Before the second packaging run, so that a failure there does not
      # lose the installers that are already built and verified.
      - name: Upload installers
        if: env.SIGNED_LATER == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.key }}${{ needs.identity.outputs.suffix }}
          path: |
            autogpt_platform/desktop/dist/*.exe
            autogpt_platform/desktop/dist/*.dmg
            autogpt_platform/desktop/dist/*.AppImage
            autogpt_platform/desktop/dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # What a release has besides the installers: the files an installed
      # app updates from, and a line for the release notes. All of them sit
      # directly in dist/, so the artifact has no directories.
      - name: Describe how this build is signed
        if: env.SIGNED_LATER == '' && inputs.release_files
        env:
          LINE: "${{ matrix.name }}: ${{ needs.gate.outputs[format('{0}_description', matrix.signer)] || 'not signed' }}"
        run: echo "${LINE}" > "dist/signing-${{ matrix.key }}.txt"

      - name: Upload the other release files
        if: env.SIGNED_LATER == '' && inputs.release_files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.key }}${{ needs.identity.outputs.suffix }}
          path: |
            autogpt_platform/desktop/dist/latest*.yml
            autogpt_platform/desktop/dist/*.blockmap
            autogpt_platform/desktop/dist/*.zip
            autogpt_platform/desktop/dist/signing-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # --- a leg with a certificate is packaged by the `sign` job --------------

      # A tar file, because an artifact keeps neither symbolic links nor the
      # executable bit. Named without a directory: tar reads `D:\...` as a
      # remote host.
      - name: Pack the runtime for the signing job
        if: env.SIGNED_LATER != ''
        run: tar -cf runtime.tar -C build runtime

      - name: Hand the runtime to the signing job
        if: env.SIGNED_LATER != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ matrix.key }}
          path: autogpt_platform/desktop/runtime.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

      - name: Free the disk the archive took
        if: env.SIGNED_LATER != ''
        run: rm -f runtime.tar

      # What the upgrade test installs over the build above. A full second
      # packaging run, because the version has to be inside the app as well
      # as in the installer's name: a same-version .deb is not an upgrade.
      # Never signed: it is installed by hand in the test, not by the updater.
      - name: Package the next version for the upgrade test
        if: inputs.e2e
        env:
          AUTOGPT_DESKTOP_VERSION: ${{ steps.version.outputs.next }}
          AUTOGPT_DESKTOP_VARIANT: ${{ needs.identity.outputs.variant }}
          AUTOGPT_DESKTOP_OUTPUT: dist-upgrade
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          rm -rf dist/win-unpacked dist/mac-arm64 dist/linux-unpacked
          npx electron-builder --config electron-builder.config.js --publish never
          if [ "${RUNNER_OS}" = macOS ]; then
            codesign --verify --deep --strict --verbose=2 "dist-upgrade/mac-arm64/${APP_FILE}.app"
          fi
          rm -rf dist-upgrade/win-unpacked dist-upgrade/mac-arm64 dist-upgrade/linux-unpacked
          df -h .

      - name: Upload the next version's installers
        if: inputs.e2e
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.key }}${{ needs.identity.outputs.suffix }}-upgrade
          path: |
            autogpt_platform/desktop/dist-upgrade/*.exe
            autogpt_platform/desktop/dist-upgrade/*.dmg
            autogpt_platform/desktop/dist-upgrade/*.AppImage
            autogpt_platform/desktop/dist-upgrade/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs-${{ matrix.key }}
          path: |
            ${{ runner.temp }}/autogpt smoke/logs/
            autogpt_platform/desktop/dist/builder-debug.yml
            autogpt_platform/desktop/dist-upgrade/builder-debug.yml
          if-no-files-found: ignore
          retention-days: 7

  # The only job that holds the certificates. It runs the packaging tools and
  # this repository's signing code (build/mac_sign.js) at the commit that was
  # asked for, and nothing else: no build of the frontend or the backend, no
  # install script of any package, no cache another job could have written,
  # and nothing out of the runtime, which it only copies and signs.
  sign:
    name: Sign (${{ matrix.name }})
    needs: [identity, gate, build]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.build.result == 'success' && needs.gate.outputs.legs != '[]' }}
    runs-on: ${{ matrix.os }}
    # Signing a few thousand files, Apple's notary service with a 2 GB
    # upload, then a second archive for the updater. On Windows every .exe
    # in the bundle is signed, one request each.
    timeout-minutes: ${{ matrix.timeout }}
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.legs) }}
    defaults:
      run:
        shell: bash
        working-directory: autogpt_platform/desktop
    env:
      # The build job has checked that this is a version.
      AUTOGPT_DESKTOP_VERSION: ${{ inputs.version || format('0.0.0-dev.{0}', github.run_number) }}
      # Every step of this job packages or checks the one app.
      AUTOGPT_DESKTOP_VARIANT: ${{ needs.identity.outputs.variant }}
      APP_FILE: ${{ needs.identity.outputs.product_filename }}
    steps:
      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download the runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-${{ matrix.key }}
          path: autogpt_platform/desktop

      # The archive comes from the job that ran third-party code, so it is
      # not trusted to stay where it belongs: after unpacking, the checkout
      # must be exactly what it was plus build/runtime. This runs before the
      # packaging tools are installed, so nothing it could have planted in
      # node_modules survives either (`npm ci` starts from an empty one).
      - name: Unpack the runtime
        run: |
          tar -xf runtime.tar -C build
          rm runtime.tar
          found="$(git status --porcelain --ignored)"
          if [ "${found}" != "!! autogpt_platform/desktop/build/runtime/" ]; then
            echo "::error::Unpacking the runtime changed more than build/runtime:"
            echo "${found}"
            exit 1
          fi

      # No install scripts: a package's script would run in the job that
      # holds the certificates. electron-builder fetches Electron itself.
      - name: Install the packaging tools
        run: npm ci --no-audit --no-fund --ignore-scripts

      # Exactly one of the next three steps runs.

      - name: Package (macOS, Developer ID, notarized)
        if: matrix.mode == 'developer-id'
        env:
          AUTOGPT_DESKTOP_MAC_SIGN: developer-id
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # notarytool wants the key as a file. It exists for this step only.
          key="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          trap 'rm -f "${key}"' EXIT
          (umask 077 && printf '%s\n' "${APPLE_API_KEY_P8}" > "${key}")
          unset APPLE_API_KEY_P8
          APPLE_API_KEY="${key}" npx electron-builder --config electron-builder.config.js --publish never

      - name: Package (Windows, Azure Trusted Signing)
        if: matrix.mode == 'azure'
        env:
          AUTOGPT_DESKTOP_WIN_SIGN: azure
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
        run: npx electron-builder --config electron-builder.config.js --publish never

      - name: Package (Windows, certificate file)
        if: matrix.mode == 'pfx'
        env:
          AUTOGPT_DESKTOP_WIN_SIGN: pfx
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --config electron-builder.config.js --publish never

      # The bundle's seal; the Claude Code CLI byte for byte as it was
      # bundled (it ships as Anthropic built it); every Mach-O file signed
      # for notarization by one team, each program's entitlements; the
      # ticket stapled; and Gatekeeper's verdict.
      - name: Verify the Developer ID signature and the notarization
        if: matrix.mode == 'developer-id'
        run: |
          app="dist/mac-arm64/${APP_FILE}.app"
          codesign --verify --deep --strict --verbose=2 "${app}"
          cmp build/runtime/site/claude_agent_sdk/_bundled/claude \
            "${app}/Contents/Resources/runtime/site/claude_agent_sdk/_bundled/claude"
          node build/mac_sign.js check "${app}"
          xcrun stapler validate "${app}"
          spctl --assess --type execute --verbose=4 "${app}"

      - name: Verify the Windows signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist/*.exe) + @(Get-Item "dist/win-unpacked/$($env:APP_FILE).exe")
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not validly signed: $($signature.Status)" }
            "$($file.Name): $($signature.SignerCertificate.Subject)"
          }
          $bundled = (Get-FileHash build/runtime/site/claude_agent_sdk/_bundled/claude.exe).Hash
          $shipped = (Get-FileHash dist/win-unpacked/resources/runtime/site/claude_agent_sdk/_bundled/claude.exe).Hash
          if ($bundled -ne $shipped) { throw 'The Claude Code CLI was changed by signing.' }

      # An installed app refuses an update unless every file its metadata
      # names is that app's own installer by name (src/updater.js). The same
      # code is asked here, so that a build whose files it would refuse
      # fails now and not as a release nobody is ever offered.
      - name: Check that installed apps will take these files as an update
        env:
          VERSION: ${{ env.AUTOGPT_DESKTOP_VERSION }}
        run: |
          shopt -s nullglob
          metadata=(dist/latest*.yml)
          if [ "${#metadata[@]}" -eq 0 ] || [ ! -f src/identity.js ]; then
            echo "No update metadata, or a commit from before this check: nothing to ask."
            exit 0
          fi
          awk '$1 == "-" && $2 == "url:" { print $3 } $1 == "path:" { print $2 }' "${metadata[@]}" | tr -d '\r' | sort -u > update-files.txt
          cat update-files.txt
          if [ ! -s update-files.txt ]; then
            echo "::error::The update metadata names no file."
            exit 1
          fi
          xargs node src/identity.js owns "${VERSION}" < update-files.txt
          rm update-files.txt

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.key }}${{ needs.identity.outputs.suffix }}
          path: |
            autogpt_platform/desktop/dist/*.exe
            autogpt_platform/desktop/dist/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Describe how this build is signed
        if: inputs.release_files
        env:
          LINE: "${{ matrix.name }}: ${{ matrix.description }}"
        run: echo "${LINE}" > "dist/signing-${{ matrix.key }}.txt"

      - name: Upload the other release files
        if: inputs.release_files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.key }}${{ needs.identity.outputs.suffix }}
          path: |
            autogpt_platform/desktop/dist/latest*.yml
            autogpt_platform/desktop/dist/*.blockmap
            autogpt_platform/desktop/dist/*.zip
            autogpt_platform/desktop/dist/signing-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sign-logs-${{ matrix.key }}
          path: autogpt_platform/desktop/dist/builder-debug.yml
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Installed app (${{ matrix.name }})
    # Not the default, which runs this only when every build leg succeeded:
    # one OS failing to build must not keep the others from being tested. A
    # leg whose installers were never uploaded fails at its download step.
    # `skipped` is the build not having run at all (the unit tests failed).
    if: ${{ !cancelled() && inputs.e2e && needs.build.result != 'skipped' }}
    # A signed leg's installers come from the `sign` job.
    needs: [identity, build, sign]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Machines that never had the build tools. macOS has 7 GB for a stack
        # that uses about 6: if it cannot start there, that leg stays red
        # until the memory work lands. It is not to be hidden.
        include:
          - name: Windows Server 2022
            os: windows-2022
            installers: windows-x64
            kind: nsis
          - name: Windows Server 2025
            os: windows-2025
            installers: windows-x64
            kind: nsis
          - name: macOS 15
            os: macos-15
            installers: macos-arm64
            kind: dmg
          - name: macOS 26
            os: macos-26
            installers: macos-arm64
            kind: dmg
          - name: Ubuntu 22.04 deb
            os: ubuntu-22.04
            installers: linux-x64
            kind: deb
          - name: Ubuntu 22.04 AppImage
            os: ubuntu-22.04
            installers: linux-x64
            kind: appimage
          - name: Ubuntu 24.04 deb
            os: ubuntu-24.04
            installers: linux-x64
            kind: deb
          - name: Ubuntu 24.04 AppImage
            os: ubuntu-24.04
            installers: linux-x64
            kind: appimage
    defaults:
      run:
        shell: bash
        working-directory: autogpt_platform/desktop/e2e
    steps:
      - name: Check out the tests from ${{ inputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # The tests take the app's names and paths from the definition
          # the build uses, src/identity.js.
          sparse-checkout: |
            autogpt_platform/desktop/e2e
            autogpt_platform/desktop/src

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installers-${{ matrix.installers }}${{ needs.identity.outputs.suffix }}
          path: ${{ runner.temp }}/installers

      # The second packaging run can fail where the first succeeded. The
      # other tests still run then; the last step of this job fails it.
      - name: Download the next version's installers
        id: upgrade
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installers-${{ matrix.installers }}${{ needs.identity.outputs.suffix }}-upgrade
          path: ${{ runner.temp }}/upgrade

      - name: A display and a session bus
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # xauth is only recommended by xvfb, and xvfb-run needs it.
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus

      - name: Disk and memory before the tests
        run: |
          df -h .
          case "${RUNNER_OS}" in
            Linux) free -m ;;
            macOS) sysctl -n hw.memsize; vm_stat ;;
            Windows) powershell -NoProfile -Command "Get-CimInstance Win32_OperatingSystem | Format-List TotalVisibleMemorySize,FreePhysicalMemory" ;;
          esac

      - name: Install the test harness
        env:
          # The tests attach to the app's own Chromium; none is downloaded.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Install, run, upgrade and uninstall the app
        env:
          # Which app was installed: its paths, its executable, its data.
          AUTOGPT_DESKTOP_VARIANT: ${{ needs.identity.outputs.variant }}
          AUTOGPT_E2E_KIND: ${{ matrix.kind }}
          AUTOGPT_E2E_INSTALLER: ${{ runner.temp }}/installers
          # Empty skips the upgrade test.
          AUTOGPT_E2E_UPGRADE_INSTALLER: ${{ steps.upgrade.outcome == 'success' && format('{0}/upgrade', runner.temp) || '' }}
          # Turns on connection auditing and the firewall's notifications on
          # this throwaway machine so that the firewall check has a log to read.
          AUTOGPT_E2E_FIREWALL: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: npx playwright test

      - name: Memory after the tests
        if: always() && runner.os == 'macOS'
        run: vm_stat

      # Two uploads, not one: upload-artifact wants one root above every
      # path, and on Windows the workspace and the home directory are on
      # different drives.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ matrix.os }}-${{ matrix.kind }}${{ needs.identity.outputs.suffix }}
          path: |
            autogpt_platform/desktop/e2e/test-results/
            autogpt_platform/desktop/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the app's logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-${{ matrix.os }}-${{ matrix.kind }}${{ needs.identity.outputs.suffix }}
          path: |
            ~/AppData/Local/${{ needs.identity.outputs.dir_name }}/logs/
            ~/Library/Application Support/${{ needs.identity.outputs.dir_name }}/logs/
            ~/.local/share/${{ needs.identity.outputs.dir_name }}/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: The upgrade was not tested
        if: always() && steps.upgrade.outcome == 'failure'
        run: |
          echo "::error::No installer of the next version was built, so the upgrade test was skipped."
          exit 1
