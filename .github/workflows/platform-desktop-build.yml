name: AutoGPT Platform - Desktop build

# Hands the commit under test to the build on the `main` branch, which holds
# all of the desktop automation (.github/workflows/desktop-build.yml there).
# Only what the desktop bundle is assembled from triggers it; the nightly run
# on `main` covers changes to the backend and the frontend.

on:
  push:
    branches: [desktop]
    paths:
      - ".github/workflows/platform-desktop-build.yml"
      - "autogpt_platform/desktop/**"
      - "autogpt_platform/single-container/runtime_config.py"
      - "autogpt_platform/single-container/bootstrap.sh"
      - "autogpt_platform/single-container/python/sitecustomize.py"
      - "autogpt_platform/db/init/**"
  pull_request:
    paths:
      - ".github/workflows/platform-desktop-build.yml"
      - "autogpt_platform/desktop/**"
      - "autogpt_platform/single-container/runtime_config.py"
      - "autogpt_platform/single-container/bootstrap.sh"
      - "autogpt_platform/single-container/python/sitecustomize.py"
      - "autogpt_platform/db/init/**"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop
    uses: ntindle/autogpt/.github/workflows/desktop-build.yml@main
    with:
      ref: ${{ github.sha }}
      e2e: false
